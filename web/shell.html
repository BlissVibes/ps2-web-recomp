<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ps2-web-recomp</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #d8d8dc; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; background: #000; }
  #bar { display: flex; gap: 16px; align-items: center; padding: 6px 12px; background: #141418; border-top: 1px solid #222; }
  #status { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stats { font-variant-numeric: tabular-nums; color: #9ad; }
  button { background: #2a3a55; color: #fff; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0"></canvas></div>
<div id="bar"><span id="status">Loading…</span><span id="stats"></span></div>
<div id="overlay"><button id="start" disabled>Loading…</button></div>
<script>
const statusEl = document.getElementById('status');
const statsEl = document.getElementById('stats');
const canvas = document.getElementById('canvas');
const params = new URLSearchParams(location.search);

function fitCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
  const height = Math.max(1, Math.round(canvas.clientHeight * ratio));
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    if (Module.calledRun && Module._ps2web_resize) Module._ps2web_resize(width, height);
  }
}
window.addEventListener('resize', fitCanvas);

const workletSource = `
class Output extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const { buffer, base } = options.processorOptions;
    this.ring = new Uint32Array(buffer, base, 4);
    this.capacity = this.ring[2];
    this.samples = new Int16Array(buffer, base + 16, this.capacity * 2);
    this.left = 0;
    this.right = 0;
  }
  process(inputs, outputs) {
    const left = outputs[0][0], right = outputs[0][1];
    const write = Atomics.load(this.ring, 0), mask = this.capacity - 1;
    let read = Atomics.load(this.ring, 1);
    for (let i = 0; i < left.length; ++i) {
      if (read !== write) {
        const at = (read & mask) * 2;
        this.left = this.samples[at] / 32768;
        this.right = this.samples[at + 1] / 32768;
        read = (read + 1) >>> 0;
      } else {
        this.left *= 0.995;
        this.right *= 0.995;
      }
      left[i] = this.left;
      right[i] = this.right;
    }
    Atomics.store(this.ring, 1, read);
    Atomics.store(this.ring, 3, 1);
    return true;
  }
}
registerProcessor('ps2-output', Output);`;

let audio = null, node = null;
async function startAudio() {
  audio = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
  await audio.audioWorklet.addModule(URL.createObjectURL(new Blob([workletSource], { type: 'application/javascript' })));
  node = new AudioWorkletNode(audio, 'ps2-output', {
    outputChannelCount: [2],
    processorOptions: { buffer: Module.HEAPU8.buffer, base: Module._ps2web_audio_ring() },
  });
  node.connect(audio.destination);
}

const keys = new Set();
const keyMap = { ArrowUp: 4, ArrowRight: 5, ArrowDown: 6, ArrowLeft: 7, KeyZ: 14, KeyX: 13, KeyA: 15, KeyS: 12,
                 KeyQ: 10, KeyW: 11, Digit1: 8, Digit2: 9, Enter: 3, Backspace: 0 };
const stickKeys = new Set(['KeyI', 'KeyJ', 'KeyK', 'KeyL']);
window.addEventListener('keydown', (e) => { if (e.code in keyMap || stickKeys.has(e.code)) { keys.add(e.code); e.preventDefault(); } });
window.addEventListener('keyup', (e) => { keys.delete(e.code); });
const padButtons = [[0, 14], [1, 13], [2, 15], [3, 12], [4, 10], [5, 11], [6, 8], [7, 9], [8, 0], [9, 3], [10, 1], [11, 2],
                    [12, 4], [13, 6], [14, 7], [15, 5]];
const axis = (v) => Math.max(0, Math.min(255, Math.round((v + 1) * 127.5)));
let lastPad = -1;
function pollInput() {
  let buttons = 0, lx = 128, ly = 128, rx = 128, ry = 128;
  for (const k of keys) if (k in keyMap) buttons |= 1 << keyMap[k];
  if (keys.has('KeyJ')) lx = 0;
  if (keys.has('KeyL')) lx = 255;
  if (keys.has('KeyI')) ly = 0;
  if (keys.has('KeyK')) ly = 255;
  for (const pad of navigator.getGamepads ? navigator.getGamepads() : []) {
    if (!pad) continue;
    for (const [index, bit] of padButtons) if (pad.buttons[index] && pad.buttons[index].pressed) buttons |= 1 << bit;
    if (pad.axes.length >= 4) {
      if (lx === 128) lx = axis(pad.axes[0]);
      if (ly === 128) ly = axis(pad.axes[1]);
      rx = axis(pad.axes[2]);
      ry = axis(pad.axes[3]);
    }
    break;
  }
  const state = buttons + lx * 65536 + ly * 16777216 + rx * 4294967296 + ry * 1099511627776;
  if (state !== lastPad) {
    lastPad = state;
    Module._ps2web_pad(buttons, lx, ly, rx, ry);
  }
}

// some browsers cannot show a canvas drawn by another GPU (hybrid laptops on Linux), so each adapter draws a few test frames first
async function canPresent(power) {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: power });
  if (!adapter) return null;
  const device = await adapter.requestDevice();
  let failed = false;
  device.lost.then((info) => {
    if (info.reason === 'destroyed') return;
    failed = true;
    console.warn('[gpu check] ' + power + ' device lost: ' + info.message);
  });
  device.onuncapturederror = (e) => {
    failed = true;
    console.warn('[gpu check] ' + power + ': ' + e.error.message);
  };
  const probe = document.createElement('canvas');
  probe.width = probe.height = 64;
  probe.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none';
  document.body.appendChild(probe);
  try {
    const context = probe.getContext('webgpu');
    context.configure({ device, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: 'opaque' });
    for (let i = 0; i < 3 && !failed; ++i) {
      const encoder = device.createCommandEncoder();
      encoder.beginRenderPass({ colorAttachments: [{ view: context.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] }).end();
      device.queue.submit([encoder.finish()]);
      await new Promise((resolve) => requestAnimationFrame(resolve));
      await device.queue.onSubmittedWorkDone();
    }
  } catch (e) {
    failed = true;
    console.warn('[gpu check] ' + power + ': ' + e);
  }
  probe.remove();
  const name = [adapter.info.vendor, adapter.info.architecture].filter(Boolean).join(' ') || power;
  device.destroy();
  return failed ? null : name;
}

async function chooseGpu() {
  if (!navigator.gpu) return 'WebGPU unavailable, software renderer';
  if (navigator.userAgent.includes('Firefox/')) {
    Module.presentCopy = true;
    return 'Firefox, frames copied to the page';
  }
  const forced = params.get('gpu');
  if (forced !== 'low') {
    const name = await canPresent('high-performance');
    if (name) return 'GPU ' + name;
  }
  const name = await canPresent('low-power');
  if (name) {
    Module.ENV.PS2_GPU_LOW_POWER = '1';
    return 'GPU ' + name;
  }
  Module.presentCopy = true;
  return 'GPU cannot draw to the page, copying frames';
}

let frames = 0, last = performance.now(), lastGpu = 0, lastEmuIdle = 0, lastRenderIdle = 0;
var Module = {
  canvas,
  arguments: ['/game/core.elf', '--arg', params.get('arg') || 'cdrom0:\\CORE.GT4;1'].concat(params.getAll('press').flatMap((p) => p.split(',').flatMap((x) => ['--press', x]))),
  discUrl: params.get('disc') || 'disc.iso',
  noSurface: params.has('nosurface'),
  presentCopy: params.has('copy'),
  print: (text) => console.log(text),
  printErr: (text) => console.log(text),
  setStatus: (text) => { if (text) statusEl.textContent = text; },
  onRuntimeInitialized: () => {
    const start = document.getElementById('start');
    if (!crossOriginIsolated) {
      start.textContent = 'This page needs cross-origin isolation (COOP and COEP headers)';
      return;
    }
    start.disabled = false;
    start.textContent = 'Start';
  },
  preRun: [() => {
    for (const [key, value] of params) if (key.startsWith('PS2_')) Module.ENV[key] = value;
    Module.addRunDependency('disc');
    Promise.all([fetch(Module.discUrl, { method: 'HEAD' }), chooseGpu().catch((e) => 'GPU check failed: ' + e)]).then(([r, gpu]) => {
      Module.discSize = Number(r.headers.get('content-length')) || 0;
      Module.gpuInfo = gpu;
      statusEl.textContent = (Module.discSize ? 'Disc ' + (Module.discSize / 1073741824).toFixed(2) + ' GB' : 'No disc image at ' + Module.discUrl) + ', ' + gpu;
      Module.removeRunDependency('disc');
    });
  }],
  audioQueuedMs: () => Module._ps2web_audio_queued_ms(),
  onFrame: () => {
    pollInput();
    ++frames;
    const now = performance.now();
    if (now - last >= 1000) {
      const gpu = Module._ps2web_gpu_ms();
      const memory = (Module.HEAPU8.length / 1048576).toFixed(0);
      const emuIdle = Module._ps2web_idle_ms(0), renderIdle = Module._ps2web_idle_ms(1), span = now - last;
      statsEl.textContent = 'frame ' + Module._ps2web_frames() + '   ' + (frames * 1000 / span).toFixed(1) + ' fps   GPU ' + ((gpu - lastGpu) / span * 100).toFixed(0) +
                            '%   idle emu ' + ((emuIdle - lastEmuIdle) / span * 100).toFixed(0) + '% gs ' + ((renderIdle - lastRenderIdle) / span * 100).toFixed(0) +
                            '%   heap ' + memory + ' MB   audio ' + Module.audioQueuedMs().toFixed(0) + ' ms';
      lastEmuIdle = emuIdle;
      lastRenderIdle = renderIdle;
      lastGpu = gpu;
      frames = 0;
      last = now;
    }
  },
  noInitialRun: true,
};

document.getElementById('start').addEventListener('click', async () => {
  document.getElementById('overlay').remove();
  canvas.focus();
  fitCanvas();
  await startAudio();
  statusEl.textContent = 'Running ' + Module.arguments[2] + ', ' + Module.gpuInfo;
  Module.callMain(Module.arguments);
});
</script>
